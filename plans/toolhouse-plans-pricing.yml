specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Toolhouse
providerId: toolhouse
created: '2026-05-04'
modified: '2026-05-22'
reconciled: true
reconciledOn: '2026-05-22'
reconciledAgainst: https://toolhouse.ai/pricing
tags:
  - Agent Infrastructure
  - AI Agents
  - AI Workers
  - Backend as a Service
  - MCP
  - Tools
description: Machine-readable plans and pricing for the Toolhouse API surface, reconciled against the
  published pricing page at toolhouse.ai/pricing on 2026-05-22. Toolhouse now markets the platform around
  "AI workers" rather than "AI agents" and meters consumption in monthly "credits" — one credit corresponds
  to one worker run on the Toolhouse runtime. All plans advertise "free unlimited tokens" and a 14-day free
  trial with no credit card required. The previous Basic (free) and Pro ($10) tiers are no longer offered
  on the public pricing page; the entry tier is now Business at $500/month.
plans:
  - id: toolhouse-business
    name: Business
    type: paid
    price: '500.00'
    priceUnit: USD/month
    description: Entry tier for companies running production AI workers. Includes 25,000 credits per month,
      up to 50 workers, 30-day log retention, worker email inbox, onboarding, organizations, and email
      support. Free unlimited tokens are included on every plan.
    entries:
      - label: Credits
        description: Monthly credit allowance for worker runs. One credit corresponds to one worker run on
          the Toolhouse runtime.
        name: credits
        type: quota
        metric: credits
        limit: 25000
        timeFrame: month
        geo: global
        domains: []
        unit: 1
        price: '0.02'
        userMultiplied: false
      - label: Workers
        description: Maximum number of workers (deployed AI agents) on the Business tier.
        name: workers
        type: quota
        metric: workers
        limit: 50
        timeFrame: lifetime
        geo: global
        domains: []
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Log Retention
        description: Worker run log retention window.
        name: log_retention
        type: quota
        metric: days
        limit: 30
        timeFrame: lifetime
        geo: global
        domains: []
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: 25,000 Credits / Month
      - name: Up to 50 Workers
      - name: 30-Day Log Retention
      - name: Worker Email Inbox
      - name: Onboarding
      - name: Organizations
      - name: Email Support
      - name: Free Unlimited Tokens
      - name: Toolhouse Platform API
      - name: Toolhouse Workers API
  - id: toolhouse-business-max
    name: Business Max
    type: paid
    price: '1200.00'
    priceUnit: USD/month
    description: Most popular tier for scaling production AI worker deployments. Includes 80,000 credits per
      month, up to 500 workers, 1-year log retention, on-demand account engineer, and priority support across
      Slack, email, and phone.
    entries:
      - label: Credits
        description: Monthly credit allowance for worker runs.
        name: credits
        type: quota
        metric: credits
        limit: 80000
        timeFrame: month
        geo: global
        domains: []
        unit: 1
        price: '0.015'
        userMultiplied: false
      - label: Workers
        description: Maximum number of workers on the Business Max tier.
        name: workers
        type: quota
        metric: workers
        limit: 500
        timeFrame: lifetime
        geo: global
        domains: []
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Log Retention
        description: Worker run log retention window.
        name: log_retention
        type: quota
        metric: days
        limit: 365
        timeFrame: lifetime
        geo: global
        domains: []
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Everything In Business
      - name: 80,000 Credits / Month
      - name: Up to 500 Workers
      - name: 1-Year Log Retention
      - name: On-Demand Account Engineer
      - name: Priority Support (Slack, Email, Phone)
      - name: Free Unlimited Tokens
  - id: toolhouse-enterprise
    name: Enterprise
    type: enterprise
    price: custom
    priceUnit: custom
    description: Custom-negotiated tier for the largest production workloads. Includes volume-priced credits,
      unlimited workers, custom log retention, named account engineer, and custom support.
    entries:
      - label: Credits
        description: Negotiated credit volume on volume pricing; -1 indicates uncapped subject to contract
          and fair use.
        name: credits
        type: quota
        metric: credits
        limit: -1
        timeFrame: month
        geo: configurable
        domains: []
        unit: 1
        price: custom
        userMultiplied: false
      - label: Workers
        description: Unlimited workers under the Enterprise tier.
        name: workers
        type: quota
        metric: workers
        limit: -1
        timeFrame: lifetime
        geo: global
        domains: []
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Log Retention
        description: Custom log retention configurable per contract.
        name: log_retention
        type: quota
        metric: days
        limit: -1
        timeFrame: lifetime
        geo: configurable
        domains: []
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Volume Pricing Credits
      - name: Unlimited Workers
      - name: Custom Log Retention
      - name: Named Account Engineer
      - name: Custom Support
      - name: Worker Email Inbox
      - name: Onboarding
      - name: Organizations
      - name: Free Unlimited Tokens
notes:
  - All plans include "free unlimited tokens" — model token costs are not separately metered to the customer
    on the published tiers.
  - "14-day free trial on all plans, cancel anytime" — no credit card required to start.
  - The previously published Basic (free) and Pro ($10/month) tiers are no longer advertised on
    toolhouse.ai/pricing as of 2026-05-22. The current entry tier is Business at $500/month.
  - Pricing reconciled against https://toolhouse.ai/pricing on 2026-05-22.

naftiko: "1.0.0-alpha2"

info:
  title: Toolhouse Agents Discovery
  description: >-
    Pulls deployed Toolhouse agents (name, slug, model, system prompt,
    installed tools, bundles, schedule) into Naftiko Fleet so Backstage
    shows every Toolhouse-running agent alongside Naftiko-declared
    capabilities. Single pane of glass for "what AI agents are operating
    in production" across the two stacks.
  tags:
    - Naftiko
    - Toolhouse
    - Partnership
    - Discovery
    - Agents
    - Backstage
  created: '2026-05-15'
  modified: '2026-05-15'

binds:
  - namespace: toolhouse-env
    description: Toolhouse Platform API key (user-scoped Bearer).
    keys:
      TOOLHOUSE_API_KEY: TOOLHOUSE_API_KEY

capability:
  consumes:
    - namespace: toolhouse
      type: http
      baseUri: https://api.toolhouse.ai
      authentication:
        type: bearer
        token: '{{TOOLHOUSE_API_KEY}}'
      resources:
        - name: list-agents
          path: '/me/agents'
          operations:
            - name: list-agents
              method: GET
            - name: upsert-agent
              method: POST
        - name: agent
          path: '/me/agents/{{agent_id}}'
          operations:
            - name: get-agent
              method: GET
              inputParameters:
                - { name: agent_id, in: path, required: true }
            - name: delete-agent
              method: DELETE
              inputParameters:
                - { name: agent_id, in: path, required: true }

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: toolhouse-agents-discovery-rest
      description: REST surface for Naftiko Fleet to discover Toolhouse agents.
      resources:
        - name: agents
          path: '/agents'
          operations:
            - name: list-agents
              method: GET
              call: toolhouse.list-agents
            - name: upsert-agent
              method: POST
              call: toolhouse.upsert-agent
        - name: agent
          path: '/agents/{agent_id}'
          operations:
            - name: get-agent
              method: GET
              inputParameters:
                - { name: agent_id, in: path, type: string, required: true }
              call: toolhouse.get-agent
            - name: delete-agent
              method: DELETE
              inputParameters:
                - { name: agent_id, in: path, type: string, required: true }
              call: toolhouse.delete-agent

    - type: mcp
      address: 0.0.0.0
      port: 3010
      namespace: toolhouse-agents-discovery-mcp
      description: MCP server exposing Toolhouse agent discovery to AI agents.
      tools:
        - name: list-agents
          description: List all Toolhouse agents the API key has access to.
          hints: { readOnly: true }
          call: toolhouse.list-agents
        - name: upsert-agent
          description: Create or update a Toolhouse agent.
          hints: { destructiveHint: false }
          call: toolhouse.upsert-agent
        - name: get-agent
          description: Get a single Toolhouse agent by ID (name, model, prompt, tools, schedule).
          hints: { readOnly: true }
          inputParameters:
            - { name: agent_id, type: string, required: true, description: Toolhouse agent UUID. }
          call: toolhouse.get-agent
        - name: delete-agent
          description: Delete a Toolhouse agent.
          hints: { destructiveHint: true }
          inputParameters:
            - { name: agent_id, type: string, required: true, description: Toolhouse agent UUID. }
          call: toolhouse.delete-agent

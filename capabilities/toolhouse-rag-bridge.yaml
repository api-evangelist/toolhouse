naftiko: "1.0.0-alpha2"

info:
  title: Toolhouse RAG Bridge
  description: >-
    Manages Toolhouse's managed RAG (Toolhouse RAG) — file uploads, RAG
    document attachment, vector store management — from Naftiko spec.
    Lets a Naftiko capability sync governed source documents into a
    Toolhouse-RAG-backed agent without leaving the spec layer. Also
    bridges agent-attached files for downstream observability.
  tags:
    - Naftiko
    - Toolhouse
    - Partnership
    - RAG
    - Files
    - Vector-Store
  created: '2026-05-15'
  modified: '2026-05-15'

binds:
  - namespace: toolhouse-env
    description: Toolhouse Platform API key.
    keys:
      TOOLHOUSE_API_KEY: TOOLHOUSE_API_KEY

capability:
  consumes:
    - namespace: toolhouse
      type: http
      baseUri: https://api.toolhouse.ai
      authentication:
        type: bearer
        token: '{{TOOLHOUSE_API_KEY}}'
      resources:
        - name: list-agent-files
          path: '/me/agents/{{agent_id}}/files'
          operations:
            - name: list-agent-files
              method: GET
              inputParameters:
                - { name: agent_id, in: path, required: true }
            - name: upload-agent-file
              method: POST
              inputParameters:
                - { name: agent_id, in: path, required: true }
        - name: agent-file
          path: '/me/agents/{{agent_id}}/files/{{file_id}}'
          operations:
            - name: get-agent-file
              method: GET
              inputParameters:
                - { name: agent_id, in: path, required: true }
                - { name: file_id, in: path, required: true }
            - name: delete-agent-file
              method: DELETE
              inputParameters:
                - { name: agent_id, in: path, required: true }
                - { name: file_id, in: path, required: true }
        - name: rag-stores
          path: '/me/rag/stores'
          operations:
            - name: list-rag-stores
              method: GET
            - name: create-rag-store
              method: POST

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: toolhouse-rag-bridge-rest
      description: REST surface for managing Toolhouse RAG documents + vector stores.
      resources:
        - name: agent-files
          path: '/agents/{agent_id}/files'
          operations:
            - name: list-agent-files
              method: GET
              inputParameters:
                - { name: agent_id, in: path, type: string, required: true }
              call: toolhouse.list-agent-files
            - name: upload-agent-file
              method: POST
              inputParameters:
                - { name: agent_id, in: path, type: string, required: true }
              call: toolhouse.upload-agent-file
        - name: agent-file
          path: '/agents/{agent_id}/files/{file_id}'
          operations:
            - name: get-agent-file
              method: GET
              inputParameters:
                - { name: agent_id, in: path, type: string, required: true }
                - { name: file_id, in: path, type: string, required: true }
              call: toolhouse.get-agent-file
            - name: delete-agent-file
              method: DELETE
              inputParameters:
                - { name: agent_id, in: path, type: string, required: true }
                - { name: file_id, in: path, type: string, required: true }
              call: toolhouse.delete-agent-file
        - name: rag-stores
          path: '/rag/stores'
          operations:
            - name: list-rag-stores
              method: GET
              call: toolhouse.list-rag-stores
            - name: create-rag-store
              method: POST
              call: toolhouse.create-rag-store

    - type: mcp
      address: 0.0.0.0
      port: 3010
      namespace: toolhouse-rag-bridge-mcp
      description: MCP server for managing Toolhouse RAG from Naftiko spec.
      tools:
        - name: list-agent-files
          description: List files attached to a Toolhouse agent for RAG.
          hints: { readOnly: true }
          inputParameters:
            - { name: agent_id, type: string, required: true, description: Toolhouse agent UUID. }
          call: toolhouse.list-agent-files
        - name: upload-agent-file
          description: Upload a new RAG document to a Toolhouse agent.
          hints: { destructiveHint: false }
          inputParameters:
            - { name: agent_id, type: string, required: true, description: Toolhouse agent UUID. }
          call: toolhouse.upload-agent-file
        - name: get-agent-file
          description: Get a single agent file by ID.
          hints: { readOnly: true }
          inputParameters:
            - { name: agent_id, type: string, required: true, description: Toolhouse agent UUID. }
            - { name: file_id, type: string, required: true, description: Toolhouse file UUID. }
          call: toolhouse.get-agent-file
        - name: delete-agent-file
          description: Delete a RAG document from a Toolhouse agent.
          hints: { destructiveHint: true }
          inputParameters:
            - { name: agent_id, type: string, required: true, description: Toolhouse agent UUID. }
            - { name: file_id, type: string, required: true, description: Toolhouse file UUID. }
          call: toolhouse.delete-agent-file
        - name: list-rag-stores
          description: List Toolhouse RAG vector stores.
          hints: { readOnly: true }
          call: toolhouse.list-rag-stores
        - name: create-rag-store
          description: Create a new Toolhouse RAG vector store.
          hints: { destructiveHint: false }
          call: toolhouse.create-rag-store

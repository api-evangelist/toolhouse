aid: toolhouse
url: >-
  https://raw.githubusercontent.com/api-evangelist/toolhouse/refs/heads/main/apis.yml
apis:
  - aid: toolhouse:platform-api
    name: Toolhouse Platform API
    tags:
      - Agent Runs
      - AI Agents
      - Agent Studio
      - API Keys
      - Billing
      - Integrations
      - Management
      - Metrics
      - Schedules
      - SDK
    humanURL: https://docs.toolhouse.ai/toolhouse
    properties:
      - url: https://docs.toolhouse.ai/toolhouse
        type: Documentation
      - url: openapi/toolhouse-openapi-original.yml
        type: OpenAPI
      - url: rules/toolhouse-rules.yml
        type: SpectralRules
      - url: capabilities/agent-management.yaml
        type: NaftikoCapability
    description: >-
      The Toolhouse Platform API provides management and orchestration
      capabilities for AI agents and connected tools. It exposes endpoints
      for user profile and billing administration, API key lifecycle,
      agent definition and deployment, agent run management with paginated
      listing and per-run logs (including MCP server logs), Agent Studio
      chat sessions, agent file management, agent subscriptions, agent
      transfer, scheduled agent execution via cron expressions, MCP server
      configuration, integrations and authentication connections, OAuth
      callback handling, and an agent-runs metrics surface for usage,
      volume, and per-agent summary reporting. The SDK API exposes the
      same agent and schedule primitives under /v1/ for direct programmatic
      use by Toolhouse CLI and SDK clients. Authentication uses HTTPBearer
      JWT tokens and per-user API keys.
  - aid: toolhouse:agents-api
    name: Toolhouse Agents API
    tags:
      - AI Agents
      - Conversations
      - Execution
      - Streaming
      - Workers
    humanURL: https://docs.toolhouse.ai/toolhouse/for-developers/workers-api
    properties:
      - url: https://docs.toolhouse.ai/toolhouse/for-developers/workers-api
        type: Documentation
    description: >-
      The Toolhouse Agents API (Workers API) enables execution of deployed
      AI agents via simple HTTP endpoints. Agents defined in code or via
      the Toolhouse CLI as YAML "th" files can be deployed and accessed
      through REST calls that support streaming responses (text and
      NDJSON), conversation continuation via persistent run IDs, stateful
      conversational memory, and full conversation history retrieval.
      Public agents require no authentication while private agents use
      Bearer token authorization with Toolhouse-issued API keys.

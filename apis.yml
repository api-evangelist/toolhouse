description: >-
  Toolhouse is a Backend-as-a-Service platform for building, deploying, and managing
  AI agents — what the product now frames as "AI workers." Builders describe a task
  in plain language and ship an agent to production in a single click; developers
  can do the same from the terminal using the Toolhouse CLI and YAML "th" files.
  Every agent is automatically wired into Toolhouse's pre-integrated capabilities,
  including web scraping and social search, Toolhouse RAG, persistent memory, an
  isolated Virtual Computer code-execution sandbox, image generation, vision,
  document parsing, file download, and MCP Discovery for connecting to thousands
  of MCP servers. The platform exposes a Workers API for invoking deployed agents
  over REST with streaming (text and NDJSON) and stateful conversation continuity,
  a Platform API for full agent and run lifecycle management, scheduling, metrics,
  and integrations, and supports no-code workflow integration through Zapier and
  Toolhouse n8n Nodes. Toolhouse runs on a broad model substrate including OpenAI,
  Anthropic, Together AI, Groq, and NVIDIA model offerings.

      - AI Workers
      - Conversations
      - Execution
      - Streaming
    serviceName: Toolhouse Workers API
    serviceCategory: API
unitEconomics:
  - name: Cost per Worker Run (Credit)
    metric: billed_cost / worker_run_credits
    target: '0.02 (Business), 0.015 (Business Max)'
  - name: Cost per Active Worker
    metric: billed_cost / workers_active
    target: TBD
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Credit Utilization
    metric: worker_run_credits_consumed / worker_run_credits_allocated
    target: '> 0.50'

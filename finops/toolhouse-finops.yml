description: FinOps framework definition for the Toolhouse API surface. Provides a FOCUS-aligned mapping
  for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs. Toolhouse
  meters consumption in monthly "credits" (one credit per worker run) rather than per-request, so the
  primary billable meter below is worker_run_credits. Model token usage is NOT separately metered to the
  customer — every published tier advertises "free unlimited tokens."
principles:
  - name: Visibility
    description: Make worker run consumption visible to engineering, product, and finance teams in near
      real-time via the Toolhouse Platform API metrics surface.
  - name: Allocation
    description: Tag every chargeable worker run with the consuming team, environment, application, and
      worker so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate worker invocation patterns, schedule cadence, and tier selection
      to reduce credits per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team and
      organization.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines

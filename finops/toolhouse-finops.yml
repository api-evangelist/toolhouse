meters:
  - name: worker_run_credits
    description: Primary Toolhouse billable meter. One credit corresponds to one worker run on the
      Toolhouse runtime. Monthly credit allowance is set by the subscribed plan (Business 25000, Business
      Max 80000, Enterprise negotiated).
    unit: credit
    aggregation: sum
    dimensions:
      - api
      - worker
      - tier
      - region
      - consumer
  - name: workers_active
    description: Count of workers deployed on the account. Subject to per-tier worker count caps (50
      Business, 500 Business Max, unlimited Enterprise).
    unit: worker
    aggregation: max
    dimensions:
      - tier
      - organization
  - name: api_requests
    description: Count of HTTP API requests (operational telemetry; not directly billed per request).
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses (operational telemetry).
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by a worker run on the Virtual Computer sandbox or other
      Toolhouse runtime (operational telemetry).
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
  - name: log_retention_days
    description: Effective log retention window for worker run logs by plan (30 days Business, 365 days
      Business Max, custom Enterprise).
    unit: day
    aggregation: max
    dimensions:
      - tier
      - organization
apis:

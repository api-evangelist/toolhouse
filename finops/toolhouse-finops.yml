specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Toolhouse
providerId: toolhouse
publisherName: Toolhouse
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-15'
reconciled: true
reconciledOn: '2026-05-15'
reconciledAgainst: https://toolhouse.ai/pricing
tags:
  - Agent Infrastructure
  - AI Agents
  - AI Workers
  - Backend as a Service
  - MCP
  - Tools
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the Toolhouse API surface. Provides a FOCUS-aligned mapping
  for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs. Toolhouse
  meters consumption in "credits" (one credit per agent run) rather than per-request, so the primary
  billable meter below is agent_run_credits.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Toolhouse
  ServiceCategory: Developer Tools / API
  ProviderName: Toolhouse
  PublisherName: Toolhouse
  InvoiceIssuerName: Toolhouse
  PricingCategory: Subscription with Included Quota
  PricingUnit: credit
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: agent_run_credits
    description: Primary Toolhouse billable meter. One credit corresponds to one agent run on the Toolhouse
      runtime. Monthly credit allowance is set by the subscribed plan (Basic 15, Pro 100, Business 15000).
    unit: credit
    aggregation: sum
    dimensions:
      - api
      - agent
      - tier
      - region
      - consumer
  - name: api_requests
    description: Count of HTTP API requests (operational telemetry; not directly billed per request).
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses (operational telemetry).
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by an agent run on the Virtual Computer sandbox or other
      Toolhouse runtime (operational telemetry).
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: Toolhouse Platform API
    baseURL: ''
    tags:
      - Agent Runs
      - AI Agents
      - API Keys
      - Billing
      - Bundles
      - Management
      - Schedules
      - Tools
    serviceName: Toolhouse Platform API
    serviceCategory: API
  - name: Toolhouse Agents API
    baseURL: ''
    tags:
      - AI Agents
      - Conversations
      - Execution
      - Streaming
    serviceName: Toolhouse Agents API
    serviceCategory: API
unitEconomics:
  - name: Cost per Agent Run (Credit)
    metric: billed_cost / agent_run_credits
    target: '0.10 (Pro), 0.0333 (Business)'
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
  - name: Credit Utilization
    metric: agent_run_credits_consumed / agent_run_credits_allocated
    target: '> 0.50'
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
